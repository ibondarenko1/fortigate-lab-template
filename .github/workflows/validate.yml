name: Validate template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the pinned Fortinet collection
        run: bash automation/install.sh
      - name: Validate training exercises and companion
        run: |
          python -m pip install pytest==9.0.2
          python -m pytest -q training
          python -m py_compile training/server.py training/company_agent.py deploy/scripts/fixture-bridge.py
          bash -n training/start-company.sh
          node --check training/static/app.js
          docker compose -f training/compose.yaml config --quiet
      - name: Run the packaged worksheet over HTTP
        env:
          WORKSHEET_PORT: 28846
        run: |
          compose=(docker compose -p policy-lab-ci -f training/compose.yaml)
          trap '"${compose[@]}" down' EXIT
          "${compose[@]}" up --build -d --wait --wait-timeout 60
          python scripts/smoke-worksheet.py --port "$WORKSHEET_PORT"
      - name: Check FreeRADIUS accept and reject responses in isolation
        run: bash training/radius/run-selftest.sh
      - name: Validate the vendor playbook and native GUI check
        run: |
          python -m py_compile scripts/check-native.py deploy/fortigate/launcher.py
          for script in automation/*.sh deploy/scripts/*.sh deploy/fortigate/*.sh; do
            bash -n "$script"
          done
          cd automation
          ANSIBLE_CONFIG="$PWD/ansible.cfg" ../.venv/bin/ansible-playbook -i inventory.example.yml audit.yml --syntax-check
      - name: Validate the deployment configuration
        env:
          FORTIGATE_UUID: 7c3928c1-9c6f-41bd-b0da-fc464411f854
        run: |
          bash deploy/scripts/render-startup-config.sh
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
