config firewall address
    edit "LAN-CLIENT"
        set subnet 10.231.31.10 255.255.255.255
    next
    edit "DMZ-WEB"
        set subnet 10.231.32.10 255.255.255.255
    next
end
config firewall policy
    edit 10
        set name "ALLOW-LAN-HTTP"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-CLIENT"
        set dstaddr "DMZ-WEB"
        set action accept
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
    edit 20
        set name "DENY-LAN-SSH"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-CLIENT"
        set dstaddr "DMZ-WEB"
        set action deny
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
end
