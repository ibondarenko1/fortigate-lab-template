config firewall address
    edit "LAN-USERS"
        set subnet 10.231.31.0 255.255.255.0
    next
    edit "LAN-RESTRICTED"
        set subnet 10.231.31.20 255.255.255.255
    next
    edit "DMZ-WEB"
        set subnet 10.231.32.10 255.255.255.255
    next
end
config firewall policy
    edit 20
        set name "ALLOW-LAN-HTTP"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-USERS"
        set dstaddr "DMZ-WEB"
        set action accept
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
    edit 10
        set name "DENY-RESTRICTED-HTTP"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-RESTRICTED"
        set dstaddr "DMZ-WEB"
        set action deny
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
end
