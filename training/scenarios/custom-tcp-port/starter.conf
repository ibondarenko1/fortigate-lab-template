config firewall address
    edit "LAN-CLIENT"
        set subnet 10.231.31.10 255.255.255.255
    next
    edit "DMZ-API"
        set subnet 10.231.32.10 255.255.255.255
    next
end
config firewall service custom
    edit "LAB-API-TCP"
        set tcp-portrange 8080
    next
end
config firewall policy
    edit 10
        set name "ALLOW-LAN-API"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-CLIENT"
        set dstaddr "DMZ-API"
        set action accept
        set schedule "always"
        set service "LAB-API-TCP"
        set logtraffic all
    next
    edit 20
        set name "DENY-LAN-HTTP"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-CLIENT"
        set dstaddr "DMZ-API"
        set action deny
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
end
