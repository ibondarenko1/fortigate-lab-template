services:
  worksheet:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 96m
    environment:
      NATIVE_GUI_URL: ${NATIVE_GUI_URL:-https://127.0.0.1:18843/}
    ports:
      - "127.0.0.1:${WORKSHEET_PORT:-18846}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://localhost:8000/training/api/catalog',timeout=3).status == 200"]
      interval: 20s
      timeout: 4s
      retries: 3
